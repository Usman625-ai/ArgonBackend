# application.properties

# Server
server.servlet.context-path=/
spring.application.name=MultiVendorEcommerce
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Karachi}
spring.jackson.serialization.write-dates-as-timestamps=false

# if anything unknown comes then backend wont crash
spring.jackson.deserialization.fail-on-unknown-properties=false

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL}&requireSSL=${DB_USE_SSL}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Karachi
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.pool-name=EcommerceHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRY}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRY}

# Mail (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:noreply@myshop.pk}
app.mail.from-name=${MAIL_FROM_NAME:MyShop Pakistan}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# CORS ? comma-separated origins. In production, set ALLOWED_ORIGINS to your
# real deployed frontend URL(s), e.g. https://myshop.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:8080,http://localhost:8081}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:multivendor-ecommerce}

# JazzCash
jazzcash.merchant-id=${JAZZCASH_MERCHANT_ID}
jazzcash.password=${JAZZCASH_PASSWORD}
jazzcash.integrity-salt=${JAZZCASH_INTEGRITY_SALT}
jazzcash.return-url=${JAZZCASH_RETURN_URL:http://localhost:8080/api/payments/jazzcash/callback}
jazzcash.currency=${JAZZCASH_CURRENCY:PKR}
jazzcash.language=${JAZZCASH_LANGUAGE:EN}
jazzcash.sandbox=${JAZZCASH_SANDBOX:true}
jazzcash.sandbox-api-url=https://sandbox.jazzcash.com.pk/ApplicationAPI/API/2.0/Purchase
jazzcash.live-api-url=https://payments.jazzcash.com.pk/ApplicationAPI/API/2.0/Purchase
jazzcash.hosted-sandbox-url=https://sandbox.jazzcash.com.pk/CustomerPortal/transactionmanagement/merchantform/
jazzcash.hosted-live-url=https://payments.jazzcash.com.pk/CustomerPortal/transactionmanagement/merchantform/

# File Upload
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Cache
# CacheManager bean is defined in CacheConfig.java (Caffeine, bounded + TTL)

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.ecommerce.multivendor=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.com.zaxxer.hikari=INFO

# Reduce logging noise
logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.hibernate.engine.jdbc.env=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Suppress Thymeleaf warning
spring.thymeleaf.check-template-location=false

# Reduce Hibernate logs
logging.level.org.hibernate=WARN

# Suppress dotenv warning (create empty file)
# Or just ignore it - not critical

# App Constants
app.order.cancellation-window-hours=${ORDER_CANCEL_HOURS:24}
app.stock.low-threshold=${LOW_STOCK_THRESHOLD:10}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}