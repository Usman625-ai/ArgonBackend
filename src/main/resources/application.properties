# application.properties

# Server
server.port=${PORT:8080}
server.servlet.context-path=/
spring.application.name=MultiVendorEcommerce
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Karachi}
spring.jackson.serialization.write-dates-as-timestamps=false

# if anything unknown comes then backend wont crash
spring.jackson.deserialization.fail-on-unknown-properties=false

# Database
# NOTE: tcpKeepAlive is deliberately NOT set here ? TiDB Cloud Serverless routes
# through AWS Global Accelerator, which ignores/blocks OS-level TCP keepalive
# packets and enforces its own 340-second idle-connection timeout regardless.
# connectTimeout is deliberately generous (20s, not 10s) ? TiDB Serverless can be
# fully scaled-to-zero and need real time to cold-start before it accepts a new
# TCP connection at all; a short timeout here doesn't just fail one request, it
# can crash the whole app at startup if pool init hits a cold DB (see the
# initialization-fail-timeout note below for how we prevent that).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL}&requireSSL=${DB_USE_SSL}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Karachi&connectTimeout=20000&socketTimeout=30000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP ? tuned around TiDB Cloud Serverless's 340-second idle-connection
# cutoff (enforced by AWS Global Accelerator, see note above). Since TCP
# keepalive packets are blocked on that path, the only way to keep a pooled
# connection alive is a real query ? keepalive-time makes Hikari send one to
# every idle connection well before the 340s cutoff, with a comfortable margin.
#
# initialization-fail-timeout=-1 is important: by default Hikari refuses to even
# start the application if it can't get a DB connection during pool init. Against
# a serverless DB that can be cold at boot time, that turns "DB needs a moment to
# wake up" into "the whole app crashes and needs a manual restart." -1 means
# Hikari starts the pool regardless and connects lazily on first real use instead.
spring.datasource.hikari.pool-name=EcommerceHikariPool
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=25000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=90000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRY}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRY}

# Mail (Brevo)
app.mail.brevo-api-key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:8080,http://localhost:8081}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:multivendor-ecommerce}

# JazzCash
jazzcash.merchant-id=${JAZZCASH_MERCHANT_ID}
jazzcash.password=${JAZZCASH_PASSWORD}
jazzcash.integrity-salt=${JAZZCASH_INTEGRITY_SALT}
jazzcash.return-url=${JAZZCASH_RETURN_URL:http://localhost:8080/api/payments/jazzcash/callback}
jazzcash.currency=${JAZZCASH_CURRENCY:PKR}
jazzcash.language=${JAZZCASH_LANGUAGE:EN}
jazzcash.sandbox=${JAZZCASH_SANDBOX:true}
jazzcash.sandbox-api-url=https://sandbox.jazzcash.com.pk/ApplicationAPI/API/2.0/Purchase
jazzcash.live-api-url=https://payments.jazzcash.com.pk/ApplicationAPI/API/2.0/Purchase
jazzcash.hosted-sandbox-url=https://sandbox.jazzcash.com.pk/CustomerPortal/transactionmanagement/merchantform/
jazzcash.hosted-live-url=https://payments.jazzcash.com.pk/CustomerPortal/transactionmanagement/merchantform/

# File Upload
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Cache
# CacheManager bean is defined in CacheConfig.java (Caffeine, bounded + TTL)

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.ecommerce.multivendor=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.com.zaxxer.hikari=INFO

# Reduce logging noise
logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.hibernate.engine.jdbc.env=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Suppress Thymeleaf warning
spring.thymeleaf.check-template-location=false

# Reduce Hibernate logs
logging.level.org.hibernate=WARN

# Suppress dotenv warning (create empty file)
# Or just ignore it - not critical

# App Constants
app.order.jazzcash-payment-window-minutes=${ORDER_JAZZCASH_PAYMENT_WINDOW_MINUTES:10}
# How often the auto-cancel job checks for stale JazzCash orders. Default: every 30 min.
app.order.auto-cancel-cron=${ORDER_AUTO_CANCEL_CRON:0 0,30 * * * *}
app.stock.low-threshold=${LOW_STOCK_THRESHOLD:10}

# JazzCash is temporarily disabled ? checkout rejects it server-side and the frontend
# shows it as "Coming Soon". Flip to true once JazzCash is ready to accept payments again.
app.payments.jazzcash-enabled=${JAZZCASH_ENABLED:false}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}